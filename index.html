<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Косынка</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Косынка">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: тихий ночной инструмент для вязания, ничего лишнего
   IDEA: счётчик рядов на спице, только сам считает петли
   PICTURE: большая круглая кнопка с кольцом прогресса петель в ряду
   COLOUR and TYPE: чистый чёрный; розовая шерсть для рядов с прибавками, мятная для рядов без; Unbounded для цифр, Manrope для текста
   LAYOUT: одна колонка: ряд и тип → кнопка → действия → следующий ряд → история → настройки */
:root{color-scheme:dark;--bg:#000;--ink:#f2f2f2;--mute:#8c8c8c;--line:#1f1f1f;--panel:#0d0d0d;--inc:#ff8a9b;--none:#9fd8c6}
*{box-sizing:border-box;min-width:0}
html,body{background:#000;overscroll-behavior:none}
body{--acc:var(--inc);margin:0;color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
body.no{--acc:var(--none)}
main{max-width:480px;margin:0 auto;padding:20px 18px calc(56px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin-bottom:22px}
.title{font:700 15px Unbounded,sans-serif}
.scheme{color:var(--mute);font-size:13px}
.now{text-align:center}
.lbl{color:var(--mute);font-size:13px}
.rownum{font:700 44px/1.05 Unbounded,sans-serif;margin:4px 0 14px}
.badge{display:inline-block;padding:8px 20px;border-radius:999px;background:var(--acc);color:#000;font-weight:700;font-size:20px;transition:background .25s}
.tapwrap{display:grid;place-items:center;margin:26px 0 10px}
.tap{position:relative;width:min(78vw,300px);aspect-ratio:1;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 50% 36%,#1d1d1d,#080808 72%);color:var(--ink);font:inherit;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;display:grid;place-items:center;transition:transform .08s}
.tap:active{transform:scale(.96)}
.tap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.track{fill:none;stroke:#1c1c1c;stroke-width:5}
.ring{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;stroke-dasharray:289.03;transition:stroke-dashoffset .2s,stroke .25s}
.count{position:relative;display:grid;justify-items:center;line-height:1}
.count b{font:700 clamp(56px,18vw,76px)/1 Unbounded,sans-serif}
.count small{color:var(--mute);font-size:16px;margin-top:12px}
.flash{position:absolute;inset:12%;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#000;font:700 20px/1.25 Unbounded,sans-serif;text-align:center;padding:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.flash.show{opacity:1}
.help{text-align:center;color:var(--mute);font-size:13px;margin:0 0 18px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:52px;border-radius:14px;border:1px solid #2a2a2a;background:var(--panel);color:var(--ink);font:600 16px Manrope,sans-serif;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.35}
.btn:focus-visible,.tap:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.next{margin:18px 0 30px;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.next small{display:block;color:var(--mute);font-size:13px}
.i{color:var(--inc)}.n{color:var(--none)}
h2{font:700 15px Unbounded,sans-serif;margin:0 0 6px}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:minmax(0,1fr) auto 6.5em;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
li b{font-weight:700}
li span:last-child{text-align:right;white-space:nowrap}
li.start{color:var(--mute)}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;color:var(--mute);min-height:44px;display:flex;align-items:center}
.set{display:grid;gap:12px;margin:6px 0 10px}
.set h3{font-size:13px;color:var(--mute);margin:10px 0 0;font-weight:600}
.set label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.set input{width:5.5em;flex:none;font:16px Manrope,sans-serif;padding:10px;border-radius:10px;border:1px solid #333;background:#111;color:var(--ink);text-align:right}
.set p{margin:0;color:var(--mute);font-size:13px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px}
.confirm .btn{min-height:44px;padding:0 18px}
.danger{border-color:#5a2a30;color:var(--inc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top"><span class="title">Косынка</span><span class="scheme" id="scheme">3 ряда с прибавками, 1 без</span></div>

  <section class="now">
    <div class="lbl">Сейчас вяжешь</div>
    <div class="rownum">Ряд <span id="rowNum">20</span></div>
    <div class="badge" id="badge">+2 прибавки</div>
  </section>

  <div class="tapwrap">
    <button class="tap" id="tap" aria-label="Провязала петлю">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="46"/><circle class="ring" id="ring" cx="50" cy="50" r="46"/></svg>
      <span class="count"><b id="cur">0</b><small>из <span id="tgt">34</span></small></span>
      <span class="flash" id="flash"></span>
    </button>
  </div>
  <p class="help">Нажимай на каждую петлю — ряд закроется сам</p>

  <div class="acts">
    <button class="btn" id="undo">−1 петля</button>
    <button class="btn" id="finish">Ряд готов ✓</button>
  </div>

  <div class="next" id="next"></div>

  <h2>История</h2>
  <ol id="hist"></ol>

  <details id="settings">
    <summary>Настройки и сброс</summary>
    <div class="set">
      <h3>Схема</h3>
      <label>Прибавок в ряду <input id="sInc" type="number" inputmode="numeric" min="0"></label>
      <label>Первый ряд без прибавок <input id="sAnchor" type="number" inputmode="numeric" min="1"></label>
      <label>Повторять каждые … ряда <input id="sPeriod" type="number" inputmode="numeric" min="0"></label>
      <p id="sNote"></p>
      <h3>Начать заново</h3>
      <label>Начать с ряда <input id="sRow" type="number" inputmode="numeric" min="1"></label>
      <label>Петель в прошлом ряду <input id="sPrev" type="number" inputmode="numeric" min="0"></label>
      <button class="btn danger" id="reset">Начать с этого места</button>
      <div class="confirm" id="confirm" hidden>История сотрётся. Точно?
        <button class="btn" id="yes">Да</button><button class="btn" id="no">Нет</button>
      </div>
    </div>
  </details>
</main>

<script>
{
  const KEY = 'kosynka-v1';
  const DEF = {startRow:20, startPrev:32, inc:2, anchor:21, period:4, done:[], cur:0};
  let S = Object.assign({}, DEF);
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign({}, DEF, JSON.parse(raw)); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const $ = id => document.getElementById(id);
  const pl = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b > 1 && b < 5 ? f[1] : f[2]; };
  const st = n => n + ' ' + pl(n, ['петля', 'петли', 'петель']);
  const pr = n => '+' + n + ' ' + pl(n, ['прибавка', 'прибавки', 'прибавок']);
  const isNo = r => S.period > 0 && (((r - S.anchor) % S.period) + S.period) % S.period === 0;
  const add = r => isNo(r) ? 0 : S.inc;
  const row = () => S.startRow + S.done.length;
  const prev = () => S.done.length ? S.done[S.done.length - 1].count : S.startPrev;
  const C = 2 * Math.PI * 46;

  function render() {
    const r = row(), a = add(r), t = prev() + a, n = r + 1, an = add(n);
    document.body.classList.toggle('no', a === 0);
    $('rowNum').textContent = r;
    $('badge').textContent = a ? pr(a) : 'Без прибавок';
    $('cur').textContent = S.cur;
    $('tgt').textContent = st(t);
    $('ring').style.strokeDashoffset = C * (1 - Math.min(S.cur / (t || 1), 1));
    $('next').innerHTML = `<small>Дальше</small>Ряд ${n} · <b class="${an ? 'i' : 'n'}">${an ? pr(an) : 'без прибавок'}</b> · ${st(t + an)}`;
    $('undo').disabled = !S.cur && !S.done.length;
    const per = S.period;
    $('scheme').textContent = per > 1 ? `${per - 1} ${pl(per - 1, ['ряд', 'ряда', 'рядов'])} с прибавками, 1 без` : per === 1 ? 'все ряды без прибавок' : 'все ряды с прибавками';
    const items = S.done.slice().reverse().map(d =>
      `<li><span>Ряд ${d.row}</span><b class="${d.add ? 'i' : 'n'}">${d.add ? '+' + d.add : 'без'}</b><span>${st(d.count)}</span></li>`);
    items.push(`<li class="start"><span>Ряд ${S.startRow - 1} · до счётчика</span><b></b><span>${st(S.startPrev)}</span></li>`);
    $('hist').innerHTML = items.join('');
  }

  let ft;
  function flash(msg) {
    const f = $('flash'); f.textContent = msg; f.classList.add('show');
    clearTimeout(ft); ft = setTimeout(() => f.classList.remove('show'), 1300);
  }
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  let wl = null;
  async function wake() {
    try { if (!wl && navigator.wakeLock) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) {}
  }

  function completeRow() {
    const r = row(), a = add(r);
    S.done.push({row: r, add: a, count: prev() + a});
    S.cur = 0;
    flash(`Ряд ${r} готов`);
    buzz([30, 50, 30]);
  }

  $('tap').addEventListener('click', () => {
    wake();
    const t = prev() + add(row());
    S.cur++;
    if (S.cur >= t) completeRow(); else buzz(8);
    save(); render();
  });

  $('finish').addEventListener('click', () => { completeRow(); save(); render(); });

  $('undo').addEventListener('click', () => {
    if (S.cur > 0) S.cur--;
    else if (S.done.length) { const d = S.done.pop(); S.cur = Math.max(d.count - 1, 0); }
    save(); render();
  });

  const num = (id, min) => { const v = parseInt($(id).value, 10); return Number.isFinite(v) && v >= min ? v : null; };
  function fillSettings() {
    $('sInc').value = S.inc; $('sAnchor').value = S.anchor; $('sPeriod').value = S.period;
    $('sRow').value = row(); $('sPrev').value = prev();
    noteUpd();
  }
  function noteUpd() {
    const list = [];
    if (S.period > 0) for (let k = 0; k < 4; k++) list.push(S.anchor + k * S.period);
    $('sNote').textContent = list.length ? `Ряды без прибавок: ${list.join(', ')}…` : 'Рядов без прибавок нет';
  }
  [['sInc', 'inc', 0], ['sAnchor', 'anchor', 1], ['sPeriod', 'period', 0]].forEach(([id, k, min]) => {
    $(id).addEventListener('change', () => { const v = num(id, min); if (v !== null) { S[k] = v; save(); render(); noteUpd(); } else $(id).value = S[k]; });
  });
  $('settings').addEventListener('toggle', () => { if ($('settings').open) fillSettings(); });

  $('reset').addEventListener('click', () => { $('confirm').hidden = false; });
  $('no').addEventListener('click', () => { $('confirm').hidden = true; });
  $('yes').addEventListener('click', () => {
    const r = num('sRow', 1), p = num('sPrev', 0);
    if (r === null || p === null) { $('confirm').hidden = true; return; }
    S.startRow = r; S.startPrev = p; S.done = []; S.cur = 0;
    save(); render(); fillSettings(); $('confirm').hidden = true;
    $('settings').open = false; window.scrollTo({top: 0});
  });

  render();
}
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
